name: Publish to PyPI

# Builds the sdist + wheel on every push and PR, and publishes to PyPI when a
# `v*` git tag is pushed. Authentication uses PyPI Trusted Publishing (OIDC);
# no API token is stored as a GitHub secret.
#
# One-time setup on PyPI (the project already exists):
#   https://pypi.org/manage/project/goodmem-semantic-kernel/settings/publishing/
#     Owner:       PAIR-Systems-Inc
#     Repository:  goodmem-semantic-kernel
#     Workflow:    publish.yml
#     Environment: pypi
#
# Release procedure:
#   1. Bump `version` in pyproject.toml.
#   2. `git tag vX.Y.Z && git push origin vX.Y.Z`.
#   3. The `publish` job runs against the `pypi` environment and uploads.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build distribution
        run: python -m build

      - name: Verify metadata
        run: python -m twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/goodmem-semantic-kernel/
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
